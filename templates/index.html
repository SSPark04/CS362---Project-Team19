<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Busy Beaver Calendar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <header class="header">
      <h1>Busy Beaver Calendar</h1>
    </header>

    <main class="grid">
      <section class="box">
        <h2>Calendar</h2>
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="today">Today</button>
          <button class="filter-btn" data-filter="week">Week</button>
          <input type="date" id="rangeStart" aria-label="Range start date" />
          <input type="date" id="rangeEnd" aria-label="Range end date" />
          <button id="applyRangeBtn" type="button">Apply Range</button>
        </div>
        <p id="rangeError" class="muted" aria-live="polite"></p>

        <table class="calendar" aria-label="Calendar table">
          <thead>
            <tr>
              <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
            </tr>
          </thead>
          <tbody id="calendarBody">
            <!-- populated by javascript -->
          </tbody>
        </table>

        <h2>Events</h2>
        <ul id="eventList">
          <!-- populated by javascript -->
        </ul>
      </section>

      <section class="box">
        <h2>Event Map (image)</h2>
        <p class="muted">
          Base map: <a href="https://technology.oregonstate.edu/services/campus-map" target="_blank" rel="noreferrer">OSU Campus Map</a>
        </p>
        <div id="map" class="mapImg"></div>      
      </section>
    </main>

    <footer class="footer"><small>Busy Beaver Calendar — Team 19</small></footer>
    <script type="module" src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/map.js') }}"></script>
  </body>
</html>
